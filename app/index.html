<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RELIEF</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <section id="stage">
      <canvas id="view" aria-label="Live preview of the exported loop, on a checkerboard so transparency shows."></canvas>
      <div id="transport">
        <button id="ov-play" type="button">Pause</button>
        <input id="ov-scrub" type="range" min="0" max="4" step="0.01" value="0" aria-label="Position in the loop" />
      </div>
    </section>
    <aside>
      <h1>RELIEF</h1>
      <div id="drop">
        <label for="file">Logo (SVG, PNG, JPEG or WebP; flat colours work best)</label>
        <input id="file" type="file" accept="image/svg+xml,.svg,image/png,image/jpeg,image/webp" />
        <span>or drop one anywhere on this page</span>
      </div>
      <p id="msg" role="status"></p>
      <div id="source" hidden>
        <div id="swatches"></div>
        <span id="srcinfo"></span>
      </div>
      <ul id="warnings" aria-label="Import warnings"></ul>
      <div id="layers" hidden>
        <div class="hd">Layers <span>0 is the back; higher sits in front. Edit to override.</span></div>
        <div id="layerlist"></div>
      </div>
      <h2>Shape</h2>
      <div id="controls"></div>
      <h2>Overlay video</h2>
      <div id="ovpanel"></div>
      <label class="check"><input id="unlit" type="checkbox" /> Unlit front: the exact brand colour, no shading (preview, video and .glb)</label>
      <h2>3D model</h2>
      <button id="dl" type="button" disabled>Download .glb</button>
      <p id="stats"></p>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
